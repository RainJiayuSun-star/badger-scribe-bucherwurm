[project]
name = "cooler-badger-scribe"
version = "0.1.0"
description = "Verbatim archival transcription for UW–Madison MLM26 / Kaggle Badger Scribe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.33",
    "addict>=2.4",
    "easydict>=1.13",
    "einops>=0.8",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "protobuf>=5.0",
    "qwen-vl-utils>=0.0.8",
    "sentencepiece>=0.2",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.49.0",
]

[project.optional-dependencies]
cuda = [
    "bitsandbytes>=0.43",
    "torch>=2.2",
    "torchvision>=0.17",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "cuda" }]
torchvision = [{ index = "pytorch-cu126", extra = "cuda" }]
