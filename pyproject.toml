[project]
name = "cooler-badger-scribe"
version = "0.1.0"
description = "Local benchmark harness for Kaggle Badger Scribe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.49.0",
    "accelerate>=0.33",
    "qwen-vl-utils>=0.0.8",
    "sentencepiece>=0.2",
    "protobuf>=5",
]

[project.optional-dependencies]
cuda = [
    "bitsandbytes>=0.43",
]

[tool.uv]
package = false
