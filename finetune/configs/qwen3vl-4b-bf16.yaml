# Qwen3-VL-4B-Instruct (base of the dh-unibe German adapter), bf16 LoRA.
# Qwen3-VL uses 16-pixel patches, so one image token covers 32x32 pixels.
model_name: qwen3vl-4b-bf16
model_id: Qwen/Qwen3-VL-4B-Instruct
curriculum: kade
quantization: none
image_patch_size: 16
max_pixels: 1310720            # 1280 image tokens, about 1.3 MP
max_pixels_by_category:
  survey_notes: 2621440        # 2560 image tokens, about 2.6 MP
max_seq_length: 8192
epochs: 3
per_device_batch_size: 1
effective_batch_size: 8
learning_rate: 0.0001
vision_learning_rate: 0.00002
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
adapter_policy: language_projector
eval_max_new_tokens: 4096
