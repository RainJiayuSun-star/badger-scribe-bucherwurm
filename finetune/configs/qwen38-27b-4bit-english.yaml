# Qwen3.8-27B LoRA on the two English categories, human pages x3. Other settings follow olmocr2-7b-bf16-english.yaml.
# The 51.7 GiB weights are quantized to NF4 on load; the vision tower and lm_head stay in bf16.
model_name: qwen38-27b-4bit-english
model_id: Qwen/Qwen3.8-27B
revision: 37561816e66b5b9153b1b64c10968c18c1e6f4a0   # on EFabric: HF_HUB_CACHE=/models finds it without a download
model_family: qwen3_5
curriculum: dominy-survey
quantization: 4bit
image_patch_size: 16
max_pixels: 1310720            # 1280 image tokens, about 1.3 MP
max_pixels_by_category:
  survey_notes: 2621440        # 2560 image tokens, about 2.6 MP
target_logits_only: true
min_free_gpu_gib: 20.0
keep_checkpoints: 1
max_seq_length: 8192
epochs: 3
per_device_batch_size: 1
effective_batch_size: 8
learning_rate: 0.0001
vision_learning_rate: 0.00002
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
adapter_policy: language_projector
eval_max_new_tokens: 4096
human_repeats: 3
